# CPU & FPU Architecture (NXP i.MX RT1062 Cortex-M7 @ 600 MHz, HalfKay ROM bootloader)
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_FPU=y

# Board-Specific Memory & Stack Sizing (Teensy 4.1 has 1 MB SRAM)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_NET_TX_STACK_SIZE=2048

# Board-Specific I/O Capabilities (NXP mcux_adc12 supports async k_poll reads)
CONFIG_ADC_ASYNC=y

# Wired 10/100 Ethernet Driver & L2 (Teensy 4.1 Ethernet Kit)
CONFIG_ETH_MCUX=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_PROMISCUOUS_MODE=y
