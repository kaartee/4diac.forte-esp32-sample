# Bootloader (ESP32-C3 RISC-V, no FPU)
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

# Board-Specific Memory & Stack Sizing (ESP32-C3 400 KB SRAM + Native ESP32 Wi-Fi Supplicant)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=40960
CONFIG_HEAP_MEM_POOL_SIZE=24576
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_NET_TX_STACK_SIZE=2048

# Wi-Fi + Shell + Persistent NVS Credential Storage (uses Espressif native supplicant)
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=n

CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y

CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y

# WS2812 onboard RGB LED on GPIO 8 (optional; standard GPIO LEDs work out of the box)
CONFIG_LED_STRIP=n
