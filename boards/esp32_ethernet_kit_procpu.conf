# Bootloader & CPU Architecture
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y
CONFIG_FPU=y
CONFIG_ESP_SPIRAM=n

# Board-Specific Memory & Stack Sizing (ESP32 176 KB static dram0_0_seg, Ethernet-only)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=45056
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_NET_TX_STACK_SIZE=2048

# Board-Specific I/O Capabilities (Espressif ADC supports synchronous read only)
CONFIG_ADC_ASYNC=n

# Wired Ethernet Driver & L2
CONFIG_ETH_ESP32=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_PROMISCUOUS_MODE=y
CONFIG_SLIP_STATISTICS=n
